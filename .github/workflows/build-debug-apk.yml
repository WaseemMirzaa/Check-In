name: Build debug APK

# Manual build of a debug Android APK. Debug builds use Android's
# auto-generated debug keystore, so this doesn't need the release
# signing secrets (there is no android/key.properties in this repo).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --debug --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Push arm64-v8a APK (chunked) to a throwaway branch for retrieval
        run: |
          # The split APKs are each well over GitHub's 100MB plain-git file
          # limit (this is a debug build: unminified, full symbols). Ship
          # just arm64-v8a (the architecture on the vast majority of real
          # devices) as <100MB chunks plus a checksum, so it can be pulled
          # back over plain git (no GitHub Actions artifact-download API
          # access needed) and reassembled.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OUT="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk"
          APK="$OUT/app-arm64-v8a-debug.apk"
          mkdir -p /tmp/apk-out
          sha256sum "$APK" | awk '{print $1}' > /tmp/apk-out/app-arm64-v8a-debug.apk.sha256
          split -b 90m -d --suffix-length=2 "$APK" /tmp/apk-out/app-arm64-v8a-debug.apk.part
          BRANCH="apk-artifact/${{ github.run_id }}"
          git checkout --orphan "$BRANCH"
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/apk-out/* .
          git add -- app-arm64-v8a-debug.apk.part* app-arm64-v8a-debug.apk.sha256
          git commit -m "Debug APK build (run ${{ github.run_id }}), arm64-v8a, chunked"
          git push origin "$BRANCH"
