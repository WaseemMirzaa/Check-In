name: Build debug APK

# Manual build of a debug Android APK. Debug builds use Android's
# auto-generated debug keystore, so this doesn't need the release
# signing secrets (there is no android/key.properties in this repo).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --debug --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Publish APKs to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Debug APKs are well over both GitHub's 100MB plain-git file
          # limit and typical file-relay size limits, so hand them off as
          # browser-downloadable Release assets instead of trying to move
          # the bytes through any other channel.
          OUT="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk"
          TAG="debug-apk-${{ github.run_id }}"
          gh release create "$TAG" \
            "$OUT"/app-arm64-v8a-debug.apk \
            "$OUT"/app-armeabi-v7a-debug.apk \
            "$OUT"/app-x86_64-debug.apk \
            --title "Debug APK build (run ${{ github.run_id }})" \
            --notes "Automated debug APK build from commit ${{ github.sha }}. Unsigned with a release key (debug keystore) — install with \`adb install -r <file>.apk\` or by enabling unknown sources; not for Play Store distribution." \
            --target "${{ github.sha }}"
